name: CI — Build Astro & Audit SEO Automatisé

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-seo-audit:
    name: Build & SEO Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run automated technical SEO audit
        run: npm run audit:seo

      - name: Check game simulation balance
        run: npm run game:check
